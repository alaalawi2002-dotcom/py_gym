<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Member</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#355CFF,#7B3FE4);
    min-height:100vh;
    padding:40px;
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

.card-box{
    max-width:1100px;
    margin:auto;
    border:none;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 20px 45px rgba(0,0,0,.30);
}

.card-header{
    background:#212529;
    color:white;
    padding:25px;
    text-align:center;
}

.card-body{
    background:white;
    padding:35px;
}

.search-box{
    margin-bottom:30px;
}

.table{
    border-radius:15px;
    overflow:hidden;
}

.table thead{
    background:#355CFF;
    color:white;
}

.table th,
.table td{
    text-align:center;
    vertical-align:middle;
}

.btn-select{
    border-radius:30px;
    font-weight:bold;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#355CFF;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:20px;
}

</style>

</head>

<body>

<div class="card card-box">

    <div class="card-header">

        <h2>

            <i class="bi bi-people-fill"></i>

            Select Member

        </h2>

        <p class="mb-0">

            Search and choose a member to assign a coach.

        </p>

    </div>

    <div class="card-body">

        <form action="/select_coash_user" method="POST">

            <div class="input-group search-box">

                <input
                    type="text"
                    name="search"
                    class="form-control form-control-lg"
                    placeholder="Search by Name or Phone">

                <button class="btn btn-primary">

                    <i class="bi bi-search"></i>

                    Search

                </button>

            </div>

        </form>

        <table class="table table-bordered table-hover">

            <thead>

                <tr>

                    <th>Photo</th>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Age</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

            {% for u in users %}

            <tr>

                <td>

                    <div class="avatar">

                        <i class="bi bi-person-fill"></i>

                    </div>

                </td>

                <td>{{u[0]}}</td>

                <td>{{u[1]}}</td>

                <td>{{u[2]}}</td>

                <td>{{u[3]}}</td>

                <td>

                    <a
                    href="{{ url_for('assign_coash_user',user_id=u[0]) }}"
                    class="btn btn-success btn-select">

                        <i class="bi bi-person-workspace"></i>

                        Assign Coach

                    </a>

                </td>

            </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
