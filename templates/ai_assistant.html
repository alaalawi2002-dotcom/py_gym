```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Assistant</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


<style>

body {

    background: #f4f7fb;
    font-family: "Tahoma", sans-serif;

}


/* الحاوية */

.ai-container {

    max-width: 900px;
    margin: 50px auto;

}


/* العنوان */

.header-card {

    background: linear-gradient(135deg,#0d6efd,#6610f2);
    color:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);

}


.header-card h1 {

    font-size:32px;
    font-weight:bold;

}



/* كارت السؤال */

.question-card {

    background:white;
    border-radius:20px;
    padding:25px;
    margin-top:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);

}


textarea {

    border-radius:15px !important;
    resize:none;

}



/* زر */

.btn-ai {

    background:#6610f2;
    color:white;
    border-radius:12px;
    padding:12px 35px;
    font-size:18px;
    border:none;

}


.btn-ai:hover {

    background:#520dc2;
    color:white;

}



/* الرد */

.answer-card {

    background:white;
    margin-top:25px;
    border-radius:20px;
    padding:30px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);

}


.answer-title {

    color:#6610f2;
    font-weight:bold;

}


.ai-response {

    background:#f8f9fa;
    border-radius:15px;
    padding:20px;
    line-height:2;
    font-size:17px;

}


</style>


</head>


<body>


<div class="container ai-container">


<!-- Header -->

<div class="header-card">

<h1>
<i class="bi bi-robot"></i>
مساعد النادي الذكي
</h1>


<p class="mb-0">
اسأل الذكاء الاصطناعي عن بيانات النادي والمشتركين والإدارة
</p>


</div>



<!-- Question -->

<div class="question-card">


<h4 class="mb-3">

<i class="bi bi-chat-dots"></i>

اكتب سؤالك

</h4>


<form action="/ai_assistant" method="POST">


<textarea 
name="question"
class="form-control"
rows="5"
placeholder="مثال:
كم عدد المشتركين؟
من انتهى اشتراكه؟
حلل أداء النادي؟"></textarea>


<button class="btn btn-ai mt-3">

<i class="bi bi-send"></i>

إرسال السؤال

</button>


</form>


</div>




<!-- Answer -->


<div class="answer-card">


<h4 class="answer-title">

<i class="bi bi-stars"></i>

رد المساعد

</h4>



<div class="ai-response mt-3">


<pre style="white-space:pre-wrap; font-family:Tahoma; margin:0;">
{{ answer }}
</pre>


</div>


</div>



</div>


</body>


</html>
```
