<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assign Coach</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#355CFF,#7B3FE4);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

.card-box{
    width:750px;
    border:none;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 20px 45px rgba(0,0,0,.30);
}

.card-header{
    background:#212529;
    color:white;
    text-align:center;
    padding:25px;
}

.card-body{
    background:white;
    padding:35px;
}

.member-card{
    background:#f8f9fa;
    border-left:6px solid #355CFF;
    border-radius:15px;
    padding:25px;
    margin-bottom:30px;
}

.member-card h4{
    margin-bottom:20px;
    font-weight:bold;
}

.info-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    padding:12px;
    background:white;
    border-radius:10px;
    border:1px solid #e5e5e5;
}

.info-title{
    font-weight:bold;
    color:#355CFF;
}

.form-label{
    font-weight:bold;
    margin-bottom:10px;
}

.form-select{
    height:55px;
    border-radius:12px;
    font-size:16px;
}

.btn-save{
    width:100%;
    height:55px;
    margin-top:25px;
    border:none;
    border-radius:40px;
    background:linear-gradient(135deg,#355CFF,#7B3FE4);
    color:white;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.btn-save:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(53,92,255,.35);
}

</style>

</head>

<body>

<div class="card card-box">

<div class="card-header">

<h2>

<i class="bi bi-person-workspace"></i>

Assign Coach

</h2>

<p class="mb-0">

Choose the appropriate coach for this member

</p>

</div>

<div class="card-body">

<div class="member-card">

<h4>

<i class="bi bi-person-circle"></i>

Member Information

</h4>

<div class="info-row">

<span class="info-title">

<i class="bi bi-hash"></i>

ID

</span>

<span>{{user[0]}}</span>

</div>

<div class="info-row">

<span class="info-title">

<i class="bi bi-person-fill"></i>

Name

</span>

<span>{{user[1]}}</span>

</div>

<div class="info-row">

<span class="info-title">

<i class="bi bi-telephone-fill"></i>

Phone

</span>

<span>{{user[2]}}</span>

</div>

<div class="info-row">

<span class="info-title">

<i class="bi bi-calendar2-week"></i>

Age

</span>

<span>{{user[3]}} Years</span>

</div>

</div>

<form action="/assign_coach" method="POST">

<input
type="hidden"
name="user_id"
value="{{user[0]}}">

<label class="form-label">

<i class="bi bi-person-video3"></i>

Select Coach

</label>

<select
name="coach_id"
class="form-select">

{% for c in coaches %}

<option value="{{c[0]}}">

{{c[1]}} | 📞 {{c[2]}} | 🎂 {{c[3]}} Years | 💪 {{c[5]}}

</option>

{% endfor %}

</select>

<button class="btn-save">

<i class="bi bi-check-circle-fill"></i>

Assign Coach

</button>

</form>

</div>

</div>

</body>
</html>
