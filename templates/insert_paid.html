<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الدفع</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: "Tahoma", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .payment-card {

            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;

        }


        .payment-card h2 {

            margin-bottom: 10px;
            color: #243b55;
            font-size: 28px;

        }


        .payment-card p {

            color: #777;
            margin-bottom: 30px;

        }


        .icon {

            font-size: 55px;
            margin-bottom: 15px;

        }



        .form-group {

            text-align: right;
            margin-bottom: 20px;

        }



        label {

            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;

        }



        select {

            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
            outline: none;
            cursor: pointer;

        }



        select:focus {

            border-color: #243b55;

        }




        input[type="submit"] {

            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg,#00c6ff,#0072ff);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;

        }



        input[type="submit"]:hover {

            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,114,255,0.4);

        }



        .footer {

            margin-top:20px;
            font-size:13px;
            color:#888;

        }


    </style>

</head>


<body>


<div class="payment-card">


    <div class="icon">
        💳
    </div>


    <h2>
        تسجيل الدفع
    </h2>


    <p>
        اختر طريقة الدفع لإتمام عملية الاشتراك
    </p>



    <form action="" method="post">


        {{form.hidden_tag()}}



        <div class="form-group">

            <label>
                طريقة الدفع
            </label>

            {{form.payment_method}}

        </div>




        {{form.submit()}}



    </form>


    <div class="footer">
        Gym Management System
    </div>


</div>



</body>

</html>
