<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym Coaches</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">


    <style>

        body {
            background: linear-gradient(135deg, #1d2671, #c33764);
            min-height: 100vh;
            font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px;
        }


        .page-title {
            color: white;
            text-align: center;
            margin-bottom: 40px;
        }


        .page-title h1 {
            font-weight: 800;
        }


        .page-title p {
            opacity: .9;
        }


        .coach-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .25);
            transition: .3s;
            height: 100%;
        }


        .coach-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, .35);
        }


        .coach-header {
            height: 130px;
            background: linear-gradient(135deg, #355CFF, #7B3FE4);
            position: relative;
        }


        .coach-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);

            border: 5px solid white;
        }


        .coach-image i {
            font-size: 55px;
            color: #355CFF;
        }


        .coach-body {
            padding: 65px 25px 25px;
            text-align: center;
        }


        .coach-name {
            font-size: 22px;
            font-weight: 800;
            color: #333;
        }


        .info {
            margin-top: 20px;
            text-align: left;
        }


        .info p {
            margin-bottom: 12px;
            font-size: 16px;
        }


        .info i {
            color: #355CFF;
            width: 25px;
        }


        .specialty {
            display: inline-block;
            background: #6f42c1;
            color: white;
            padding: 7px 18px;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 10px;
        }


        .actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }


        .actions a,
        .actions button {
            flex: 1;
            border-radius: 30px;
            font-weight: bold;
        }


        .empty {
            background: white;
            padding: 50px;
            border-radius: 25px;
            text-align: center;
        }


        /* =========================
   Edit Mode
========================= */

.edit-field {
    position: relative;
    margin-bottom: 15px;
}

.edit-field i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #355CFF;
    font-size: 17px;
    z-index: 2;
}

.edit-input {
    width: 100%;
    border: 2px solid #e9ecef;
    border-radius: 14px;
    padding: 12px 15px 12px 45px;
    font-size: 15px;
    font-weight: 600;
    outline: none;
    background: #f8f9ff;
    transition: all .25s ease;
}

.edit-input:focus {
    border-color: #355CFF;
    background: white;
    box-shadow: 0 0 0 4px rgba(53, 92, 255, .12);
}

/* عنوان التعديل */

.edit-title {
    font-size: 13px;
    font-weight: 700;
    color: #777;
    margin-bottom: 5px;
    text-align: left;
}

/* أزرار التعديل */

.edit-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.save-btn,
.cancel-btn {
    flex: 1;
    border: none;
    padding: 11px;
    border-radius: 14px;
    font-weight: 700;
    transition: .25s;
}

.save-btn {
    background: #198754;
    color: white;
}

.save-btn:hover {
    background: #157347;
    transform: translateY(-2px);
}

.cancel-btn {
    background: #e9ecef;
    color: #333;
}

.cancel-btn:hover {
    background: #dee2e6;
    transform: translateY(-2px);
}

/* البطاقة أثناء التعديل */

.coach-card.editing {
    border: 2px solid rgba(53, 92, 255, .25);
    box-shadow: 0 20px 50px rgba(53, 92, 255, .25);
    transform: translateY(-5px);
}

    </style>

</head>


<body>


<div class="container">


    <div class="page-title">

        <h1>
            <i class="bi bi-person-workspace"></i>
            Gym Coaches
        </h1>

        <p>
            Manage your gym trainers
        </p>

    </div>


    <div class="row g-4">


        {% for c in coashes %}


        <div class="col-lg-4 col-md-6 col-sm-12">


            <div class="coach-card" data-id="{{ c[0] }}">


                <div class="coach-header">

                    <div class="coach-image">

                        <i class="bi bi-person-fill"></i>

                    </div>

                </div>


                <div class="coach-body">


                    <!-- Name -->

                    <h3 class="coach-name">
                        {{ c[1] }}
                    </h3>


                    <!-- Specialty -->

                    <span class="specialty">

                        <i class="bi bi-award-fill"></i>

                        {{ c[5] }}

                    </span>


                    <div class="info">


                        <!-- Phone -->

                        <p class="phone">

                            <i class="bi bi-telephone-fill"></i>

                            {{ c[2] }}

                        </p>


                        <!-- Age -->

                        <p class="age">

                            <i class="bi bi-calendar3"></i>

                            Age : {{ c[3] }}

                        </p>


                        <!-- ID -->

                        <p>

                            <i class="bi bi-person-badge"></i>

                            ID : {{ c[0] }}

                        </p>


                    </div>


                    <div class="actions">


                        <a href="#"
                           class="btn btn-primary">

                            <i class="bi bi-eye-fill"></i>

                            View

                        </a>


                        <button
                            type="button"
                            class="btn btn-warning edit-btn"
                            onclick="editCoach(this)">

                            <i class="bi bi-pencil-fill"></i>

                            Edit

                        </button>


                        <a href="/remove_coash/{{c[0]}}"
                           class="btn btn-danger">

                            <i class="bi bi-trash-fill"></i>

                            Delete

                        </a>


                    </div>


                </div>


            </div>


        </div>


        {% else %}


        <div class="empty">

            <i class="bi bi-person-x fs-1"></i>

            <h3 class="mt-3">
                No Coaches Found
            </h3>

            <p>
                There are no trainers registered yet.
            </p>

        </div>


        {% endfor %}


    </div>


</div>



<script>
function editCoach(button) {

    let row = button.closest(".coach-card");

    let name = row.querySelector(".coach-name");
    let phone = row.querySelector(".phone");
    let age = row.querySelector(".age");
    let specialty = row.querySelector(".specialty");

    /* إضافة حالة التعديل للبطاقة */

    row.classList.add("editing");


    /* =========================
       حفظ القيم القديمة
    ========================= */

    let oldName = name.textContent.trim();

    let oldPhone = phone.textContent.trim();

    let oldAge = age.textContent
        .replace("Age :", "")
        .trim();

    let oldSpecialty = specialty.textContent.trim();


    /* =========================
       Name
    ========================= */

    name.innerHTML = `

        <div class="edit-title">
            Coach Name
        </div>

        <div class="edit-field">

            <i class="bi bi-person-fill"></i>

            <input
                type="text"
                class="edit-input"
                value="${oldName}"
            >

        </div>

    `;


    /* =========================
       Phone
    ========================= */

    phone.innerHTML = `

        <div class="edit-title">
            Phone Number
        </div>

        <div class="edit-field">

            <i class="bi bi-telephone-fill"></i>

            <input
                type="text"
                class="edit-input"
                value="${oldPhone}"
            >

        </div>

    `;


    /* =========================
       Age
    ========================= */

    age.innerHTML = `

        <div class="edit-title">
            Age
        </div>

        <div class="edit-field">

            <i class="bi bi-calendar3"></i>

            <input
                type="number"
                class="edit-input"
                value="${oldAge}"
            >

        </div>

    `;


    /* =========================
       Specialty
    ========================= */

    specialty.innerHTML = `

        <div class="edit-title">
            Specialty
        </div>

        <div class="edit-field">

            <i class="bi bi-award-fill"></i>

            <input
                type="text"
                class="edit-input"
                value="${oldSpecialty}"
            >

        </div>

    `;


    /* =========================
       الحصول على الـ inputs
    ========================= */

    let input_name =
        name.querySelector("input");

    let input_phone =
        phone.querySelector("input");

    let input_age =
        age.querySelector("input");

    let input_specialty =
        specialty.querySelector("input");


    /* =========================
       تغيير الأزرار
    ========================= */

    let actions = row.querySelector(".actions");

    actions.innerHTML = `

        <button
            type="button"
            class="save-btn">

            <i class="bi bi-check-circle-fill"></i>
            Save

        </button>

        <button
            type="button"
            class="cancel-btn">

            <i class="bi bi-x-circle-fill"></i>
            Cancel

        </button>

    `;


    let saveButton =
        actions.querySelector(".save-btn");

    let cancelButton =
        actions.querySelector(".cancel-btn");


    /* =========================
       SAVE
    ========================= */

    saveButton.onclick = function () {

        let id = row.dataset.id;

        let new_name =
            input_name.value;

        let new_phone =
            input_phone.value;

        let new_age =
            input_age.value;

        let new_specialty =
            input_specialty.value;


        fetch("/update_coash", {

            method: "POST",

            body: new URLSearchParams({

                id: id,

                name: new_name,

                phone: new_phone,

                age: new_age,

                specialty: new_specialty

            })

        })
        .then(response => response.text())

        .then(data => {

            alert(data);

            location.reload();

        })

        .catch(error => {

            console.error(error);

            alert("Something went wrong");

        });

    };


    /* =========================
       CANCEL
    ========================= */

    cancelButton.onclick = function () {

        location.reload();

    };

}
</script>


</body>

</html>
